name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rubocop:
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: Gemfile.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "2.7"
            gemfile: Gemfile.6.1
          - ruby: "3.1"
            gemfile: Gemfile.7.0
          - ruby: "3.2"
            gemfile: Gemfile.7.1
          - ruby: "3.3"
            gemfile: Gemfile.7.2
          - ruby: "3.4"
            gemfile: Gemfile.8.0
          - ruby: "4.0"
            gemfile: Gemfile.8.1
          - ruby: "4.0"
            gemfile: Gemfile.viewcomponent-4

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v4
      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec
